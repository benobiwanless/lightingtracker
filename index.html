<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Live Lightning Radar</title>
    <!-- Leaflet.js Interactive Mapping Assets -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* 🗺️ Full Screen Map Layout */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 📊 Floating Glass Dashboard Overlay */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000; /* Keeps metrics on top of map tiles */
            background: rgba(22, 26, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 18px 24px;
            min-width: 280px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: #f0f4f8;
            font-size: 1.2rem;
            margin: 0;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.75rem;
            background: rgba(255, 184, 108, 0.15);
            color: #ffb86c;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.connected {
            background: rgba(80, 250, 123, 0.15);
            color: #50fa7b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .metric-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6272a4;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: 800;
            color: #00f2fe;
            font-variant-numeric: tabular-nums;
        }

        .hud-footer {
            margin-top: 10px;
            font-size: 0.7rem;
            font-family: monospace;
            color: #6272a4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Smooth fading animation for flash markers */
        .leaflet-interactive {
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body>

    <!-- Floating HUD Display -->
    <div class="hud-overlay">
        <div class="hud-header">
            <h1>⚡ Global Tracker</h1>
            <div id="status-badge" class="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Connecting</span>
            </div>
        </div>
        <div class="metric-container">
            <div class="metric-label">Strikes on Screen (30m)</div>
            <div id="visible-count" class="metric-value">0</div>
        </div>
        <div id="hud-log" class="hud-footer">Initializing system mapping...</div>
    </div>

    <!-- Map Canvas Element -->
    <div id="map"></div>

    <!-- Leaflet Script Dependancy -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize map centered near Auburndale, FL but pulled back for visibility
        const map = L.map('map', {
            zoomControl: false // Hide default icons to maintain clean look
        }).setView([28.0653, -81.7887], 7);

        // Position zoom controllers customly on bottom right corner out of HUD's way
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Inject dark, minimalist night-mode map skin tiles
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // State Tracking Data structures
        let globalStrikes = [];
        let socket;

        const wsServers = [
            "wss://ws1.blitzortung.org:3000",
            "wss://ws3.blitzortung.org:3000",
            "wss://ws5.blitzortung.org:3000",
            "wss://ws7.blitzortung.org:3000"
        ];

        // UI Hooks
        const visibleCountEl = document.getElementById('visible-count');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const logEl = document.getElementById('hud-log');

        // Standard string expansion engine used to unpack raw packets from blitz stream
        function decodeBlitzData(b) {
            var a, e = {}, d = b.split(""), c = d, f = c, g = [c], h = 256;
            let o = h; 
            for (b = 1; b < d.length; b++) {
                a = d[b].charCodeAt(0);
                a = h > a ? d[b] : e[a] ? e[a] : f + c;
                g.push(a);
                c = a.charAt(0);
                e[o] = f + c;
                o++;
                f = a;
            }
            return g.join("");
        }

        // Live Network Websocket Stream Driver
        function connectStreamPipeline() {
            const endpoint = wsServers[Math.floor(Math.random() * wsServers.length)];
            socket = new WebSocket(endpoint);

            socket.onopen = () => {
                statusBadge.classList.add('connected');
                statusText.innerText = "Live";
                logEl.innerText = "Listening for global storm arrays...";
                socket.send(JSON.stringify({ "a": 1 }));
            };

            socket.onmessage = (event) => {
                try {
                    let raw = event.data;
                    if (typeof raw === "string" && !raw.startsWith("{")) {
                        raw = decodeBlitzData(raw);
                    }
                    const packet = JSON.parse(raw);
                    
                    const lat = packet.lat || (Array.isArray(packet) ? packet[1] : null);
                    const lon = packet.lon || (Array.isArray(packet) ? packet[2] : null);

                    if (lat && lon) {
                        processIncomingGlobalStrike(lat, lon);
                    }
                } catch(e) {}
            };

            socket.onclose = () => {
                statusBadge.classList.remove('connected');
                statusText.innerText = "Reconnected";
                logEl.innerText = "Re-indexing socket relays...";
                setTimeout(connectStreamPipeline, 4000);
            };
        }

        function processIncomingGlobalStrike(lat, lon) {
            const time = Date.now();
            
            // Build visual marker parameters with bright color profile
            const marker = L.circleMarker([lat, lon], {
                radius: 6,
                fillColor: '#00f2fe',
                color: '#fff',
                weight: 1,
                fillOpacity: 1.0,
                opacity: 1.0
            });

            // Store inside global master array list
            globalStrikes.push({ time, lat, lon, marker });

            // Evaluate if marker needs drawing immediately based on current screen frame bounds
            const mapBounds = map.getBounds();
            if (mapBounds.contains([lat, lon])) {
                marker.addTo(map);
                
                // Fast execution burst effect ring
                setTimeout(() => {
                    marker.setStyle({ radius: 4, color: 'transparent' });
                }, 300);
            }
        }

        // Periodic maintenance engine window logic
        function updateMapBoundsCounters() {
            const now = Date.now();
            const currentBounds = map.getBounds();
            let visibleCount = 0;

            // Loop backward through array to prune entries older than 30 minutes seamlessly
            for (let i = globalStrikes.length - 1; i >= 0; i--) {
                const strike = globalStrikes[i];
                const age = now - strike.time;

                if (age > 30 * 60 * 1000) {
                    // Pull off map rendering layer completely
                    if (map.hasLayer(strike.marker)) {
                        map.removeLayer(strike.marker);
                    }
                    globalStrikes.splice(i, 1);
                    continue;
                }

                // Dynamic age color scaling calculations
                if (age < 60000) { // Under 1 minute
                    strike.marker.setStyle({ fillColor: '#00f2fe' });
                } else if (age < 300000) { // Under 5 minutes
                    strike.marker.setStyle({ fillColor: '#ffb86c' });
                } else { // Up to 30 minutes
                    strike.marker.setStyle({ fillColor: '#8b5cf6' });
                }

                // Fade alpha opacity out slowly matching true age limits
                const calculatedOpacity = Math.max(0.15, 1.0 - (age / (30 * 60 * 1000)));
                strike.marker.setStyle({ fillOpacity: calculatedOpacity });
