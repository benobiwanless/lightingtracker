<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Lightning Tracker - Auburndale FL</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-glow: rgba(0, 242, 254, 0.15);
            --text-main: #f0f4f8;
            --text-muted: #6272a4;
            --lightning-color: #00f2fe;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 24px;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            font-size: 0.8rem;
            background: rgba(255, 184, 108, 0.1);
            color: #ffb86c;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.connected {
            background: rgba(80, 250, 123, 0.1);
            color: #50fa7b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .coordinates {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 📡 Radar Canvas Map Style */
        .map-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: radial-gradient(circle, #1a2333 0%, #0d131f 100%);
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .network-log {
            margin-top: 16px;
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <header>
            <h1>⚡ Lightning Tracker</h1>
            <div id="status-badge" class="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <div class="coordinates">📍 Auburndale, FL &bull; 28.0653° N, 81.7887° W</div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Strikes (30 Mins)</div>
                <div id="strike-count" class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Closest Strike</div>
                <div id="closest-strike" class="stat-value">--</div>
            </div>
        </div>

        <div class="map-container">
            <canvas id="radarCanvas"></canvas>
        </div>

        <div id="network-log" class="network-log">Initializing data pipeline...</div>
    </div>

    <script>
        // 📍 Anchor Center Config (Auburndale, FL)
        const HOME_LAT = 28.0653;
        const HOME_LON = -81.7887;
        const MAX_RADIUS_KM = 50; // Perimeter boundary width (50km window)

        // UI Element Hooks
        const countEl = document.getElementById('strike-count');
        const closestEl = document.getElementById('closest-strike');
        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const logEl = document.getElementById('network-log');
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic State Arrays
        let strikesArray = [];
        let socket;

        // Blitzortung rotated proxy load balances
        const wsServers = [
            "wss://ws1.blitzortung.org:3000",
            "wss://ws3.blitzortung.org:3000",
            "wss://ws5.blitzortung.org:3000",
            "wss://ws7.blitzortung.org:3000"
        ];

        // Resize Radar to native high-density values
        function resizeCanvas() {
            const size = canvas.parentElement.clientWidth;
            canvas.width = size * window.devicePixelRatio;
            canvas.height = size * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Earth Curve Trigonometry Calculation
        function getDistanceAndAzimuth(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth KM radius
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            // Compute structural bearing angle relative to center point
            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const azimuth = Math.atan2(y, x);

            return { distance, azimuth };
        }

        // LZW Decoding routine built directly to unpack Blitz network arrays
        function decodeBlitzData(b) {
            var a, e = {}, d = b.split(""), c = d, f = c, g = [c], h = 256;
            let o = h; 
            for (b = 1; b < d.length; b++) {
                a = d[b].charCodeAt(0);
                a = h > a ? d[b] : e[a] ? e[a] : f + c;
                g.push(a);
                c = a.charAt(0);
                e[o] = f + c;
                o++;
                f = a;
            }
            return g.join("");
        }

        // Network Socket Thread Manager
        function openConnection() {
            const server = wsServers[Math.floor(Math.random() * wsServers.length)];
            logEl.innerText = `Connecting to routing path: ${server}`;
            
            socket = new WebSocket(server);

            socket.onopen = () => {
                statusBadge.classList.add('connected');
                statusText.innerText = "Live";
                logEl.innerText = "Pipeline steady. Listening for Floridian electrical activity...";
                socket.send(JSON.stringify({ "a": 1 })); // Dynamic protocol verification handshake
            };

            socket.onmessage = (event) => {
                try {
                    let raw = event.data;
                    if (typeof raw === "string" && !raw.startsWith("{")) {
                        raw = decodeBlitzData(raw);
                    }
                    const packet = JSON.parse(raw);
                    
                    // Parse normalized strike coordinates across variable JSON mutations
                    const lat = packet.lat || (Array.isArray(packet) ? packet[1] : null);
                    const lon = packet.lon || (Array.isArray(packet) ? packet[2] : null);

                    if (!lat || !lon) return;

                    const geo = getDistanceAndAzimuth(HOME_LAT, HOME_LON, lat, lon);

                    if (geo.distance <= MAX_RADIUS_KM) {
                        registerNewStrike(lat, lon, geo.distance, geo.azimuth);
                    }
                } catch(e) {}
            };

            socket.onclose = () => {
                statusBadge.classList.remove('connected');
                statusText.innerText = "Reconnecting";
                logEl.innerText = "Connection lost. Cycling downstream endpoints...";
                setTimeout(openConnection, 4000);
            };
        }
