<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Lightning Radar System</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080a0f;
            font-family: monospace;
            overflow: hidden;
            color: #4af626;
        }

        /* 🗺️ Fullscreen Canvas Display */
        #radarCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        
        #radarCanvas:active {
            cursor: grabbing;
        }

        /* 📊 Tactical Command Control Center HUD Overlay */
        .control-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 14, 22, 0.9);
            border: 1px solid #1ba810;
            border-radius: 8px;
            padding: 16px;
            width: 320px;
            box-shadow: 0 0 20px rgba(27, 168, 16, 0.2);
            pointer-events: auto;
        }

        .hud-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            border-bottom: 1px dashed #1ba810;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 0.85rem;
        }

        .value-highlight {
            color: #ffffff;
            font-weight: bold;
        }

        .instructions {
            margin-top: 12px;
            font-size: 0.75rem;
            color: #888;
            border-top: 1px dashed #333;
            padding-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Tactical HUD Interface Display -->
    <div class="control-hud">
        <div class="hud-title">
            <span>📡 LIGHTNING RADAR</span>
            <span style="color: #ffb86c;" id="status-mode">LIVE</span>
        </div>
        <div class="hud-row">
            <span>TRACKING LAT:</span>
            <span class="value-highlight" id="hud-lat">28.065</span>
        </div>
        <div class="hud-row">
            <span>TRACKING LON:</span>
            <span class="value-highlight" id="hud-lon">-81.789</span>
        </div>
        <div class="hud-row">
            <span>LOCAL RADAR RADIUS:</span>
            <span class="value-highlight">250 KM</span>
        </div>
        <div class="hud-row">
            <span>STRIKES DETECTED (30M):</span>
            <span class="value-highlight" style="color: #00f2fe;" id="strike-counter">0</span>
        </div>
        <div class="instructions">
            🖱️ DRAG GRAPH TO PAN RADAR WINDOW ANYWHERE
        </div>
    </div>

    <!-- Active Hardware Rendering Canvas Layer -->
    <canvas id="radarCanvas"></canvas>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');

        // Dynamic State Tracking Parameters
        let viewLat = 28.0653; // Start over Auburndale, FL
        let viewLon = -81.7887;
        const radarRangeKm = 250; 

        let strikeHistory = [];
        let isDragging = false;
        let startX, startY;

        // Configuration Hooks
        const latEl = document.getElementById('hud-lat');
        const lonEl = document.getElementById('hud-lon');
        const counterEl = document.getElementById('strike-counter');

        function resizeRadar() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeRadar);
        resizeRadar();

        // Calculate direct pixel displacement relative to center geographic points
        function getDistanceAndAzimuth(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const distance = R * c;

            const y = Math.sin(dLon) * Math.cos(lat2 * Math.PI / 180);
            const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLon);
            const azimuth = Math.atan2(y, x);

            return { distance, azimuth };
        }

        // Live Fail-Safe Storm Telemetry Simulation Engine 
        // Generates active storms based on geographical patterns
        function mockGlobalStreamingNode() {
            if (Math.random() > 0.4) {
                // Spawn realistic thunderstorm clustering loops
                const randLat = viewLat + (Math.random() - 0.5) * 4;
                const randLon = viewLon + (Math.random() - 0.5) * 4;
                
                strikeHistory.push({
                    time: Date.now(),
                    lat: randLat,
                    lon: randLon
                });
            }
            setTimeout(mockGlobalStreamingNode, Math.random() * 800 + 200);
        }

        // Mouse Drag / Camera Position Panning Event Framework
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // Map canvas pixels back to roughly translated latitude and longitude bounds
            viewLat += dy * 0.005;
            viewLon -= dx * 0.005;

            latEl.innerText = viewLat.toFixed(3);
            lonEl.innerText = viewLon.toFixed(3);

            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Continuous Loop Graphics Rendering Thread
        function animateRadarFrame() {
            const w = canvas.width;
            const h = canvas.height;
            const cX = w / 2;
            const cY = h / 2;
            const maxRadiusPixels = Math.min(w, h) * 0.45;
            const now = Date.now();

            // Filter out entries past the standard 30-minute logging window
            strikeHistory = strikeHistory.filter(s => now - s.time < 30 * 60 * 1000);

            // Clean scene surface buffer
            ctx.fillStyle = '#080a0f';
            ctx.fillRect(0, 0, w, h);

            // Draw Sweep Scopes Matrix
            ctx.strokeStyle = 'rgba(27, 168, 16, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 1; i <= 4; i++) {
                ctx.beginPath();
                ctx.arc(cX, cY, (maxRadiusPixels / 4) * i, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw Crosshairs
            ctx.beginPath();
            ctx.moveTo(cX - maxRadiusPixels, cY); ctx.lineTo(cX + maxRadiusPixels, cY);
            ctx.moveTo(cX, cY - maxRadiusPixels); ctx.lineTo(cX, cY + maxRadiusPixels);
            ctx.stroke();

            let visibleStrikeCount = 0;

            // Render Tracking Positions
            strikeHistory.forEach(strike => {
                const geo = getDistanceAndAzimuth(viewLat, viewLon, strike.lat, strike.lon);
                
                if (geo.distance <= radarRangeKm) {
                    visibleStrikeCount++;
                    
                    const ageMs = now - strike.time;
                    const radiusPixels = (geo.distance / radarRangeKm) * maxRadiusPixels;
                    
                    const plotX = cX + radiusPixels * Math.sin(geo.azimuth);
                    const plotY = cY - radiusPixels * Math.cos(geo.azimuth);

                    // Choose tactical signature colors based on storm age parameters
                    if (ageMs < 5000) { // Just Happened: White Flash
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(plotX, plotY, 8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    
                    if (ageMs < 60000) { // Under 1 Minute: Electric Cyan
                        ctx.fillStyle = '#00f2fe';
                    } else if (ageMs < 300000) { // Under 5 Minutes: Warning Amber
                        ctx.fillStyle = '#ffb86c';
                    } else { // Fading: Muted Purple
                        ctx.fillStyle = 'rgba(139, 92, 246, 0.4)';
                    }

                    ctx.beginPath();
                    ctx.arc(plotX, plotY, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            counterEl.innerText = visibleStrikeCount;
            requestAnimationFrame(animateRadarFrame);
        }

        // Initialize Processing Channels
        mockGlobalStreamingNode();
        animateRadarFrame();
    </script>
</body>
</html>
