<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Interactive Weather Tracker</title>
    
    <!-- 🗺️ Core Open-Source Map Engine Assets -->
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <script src="https://unpkg.com" crossorigin=""></script>
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0f12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Full Screen Map Surface Frame */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 📊 Floating HUD Status Overlay Badge */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(22, 26, 34, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #50fa7b;
            box-shadow: 0 0 10px #50fa7b;
        }

        .status-text {
            color: #f0f4f8;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- Floating HUD Display -->
    <div class="hud-overlay">
        <div class="status-dot"></div>
        <div class="status-text">LIVE WEATHER RADAR</div>
    </div>

    <!-- Map Canvas Element -->
    <div id="map"></div>

    <script>
        // Start map view centered over Auburndale, Florida
        const map = L.map('map', {
            zoomControl: false
        }).setView([28.0653, -81.7887], 8);

        // Position zoom controls safely on bottom right corner out of HUD's way
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Inject dark, sleek global base map tiles
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // 📡 Fetch live radar imagery from the global RainViewer API pipeline
        fetch('https://rainviewer.com')
            .then(response => response.json())
            .then(data => {
                // Grab the most recent real-time radar data block
                const latestRadarTime = data.radar.past[data.radar.past.length - 1].time;
                
                // Overlay the dynamic weather layer onto your map canvas
                L.tileLayer(`https://rainviewer.com{latestRadarTime}/512/{z}/{x}/{y}/1/1_1.png`, {
                    attribution: 'Radar data &copy; RainViewer',
                    opacity: 0.65,
                    zIndex: 100
                }).addTo(map);
            })
            .catch(err => console.error("Error loading weather stream tiles:", err));
    </script>
</body>
</html>
