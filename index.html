<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Lightning Strike Tracker</title>
    <!-- Leaflet CSS for Mapping Component -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0d1117;
            color: #c9d1d9;
        }
        h1 { color: #f0f6fc; margin-bottom: 5px; }
        .controls {
            margin-bottom: 15px;
            background: #161b22;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        input, button {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            margin-right: 10px;
        }
        button {
            background: #238636;
            color: #ffffff;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #2ea043; }
        #map {
            height: 600px;
            width: 100%;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        .status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>⚡ Real-Time Lightning Strike Tracker</h1>
    <p>Visualize lightning strike distributions globally using interactive map interfaces.</p>

    <div class="controls">
        <label>API Key: </label>
        <input type="password" id="apiKey" placeholder="Paste your OpenWeather API Key" value="8c8ea33a88124ab0744dda93235f1230">
        
        <label>Lat: </label>
        <input type="number" id="lat" value="28.024" step="0.001" style="width: 80px;">
        
        <label>Lon: </label>
        <input type="number" id="lon" value="-81.794" step="0.001" style="width: 80px;">
        
        <button onclick="fetchLightningData()">Scan Area</button>
        <div class="status" id="statusMsg">Ready to scan.</div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com"></script>
    <script>
        // Initialize the Leaflet Map centered over default coordinates
        const map = L.map('map').setView([28.024, -81.794], 8);

        // Load a dark theme tile layer to simulate night sky/storm tracking environment
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Layer group to hold the active lightning markers
        let lightningLayer = L.layerGroup().addTo(map);

        async function fetchLightningData() {
            const key = document.getElementById('apiKey').value.trim();
            const lat = document.getElementById('lat').value;
            const lon = document.getElementById('lon').value;
            const status = document.getElementById('statusMsg');

            if (!key) {
                status.innerText = "⚠️ Missing API Key!";
                status.style.color = "#f85149";
                return;
            }

            status.innerText = "Scanning skies for lightning activity...";
            status.style.color = "#58a6ff";
            lightningLayer.clearLayers();

            // OpenWeather Lightning API uses ISO-8601 UTC formats for parameters
            const end = new Date();
            const start = new Date(end.getTime() - (60 * 60 * 1000)); // Pull past 1 hour of records
            
            const startISO = start.toISOString();
            const endISO = end.toISOString();

            // Constructing endpoint based on OpenWeather Lightning API specifications
            const url = `https://openweathermap.org{lat}&lon=${lon}&radius=50&start=${startISO}&end=${endISO}&appid=${key}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                // If strikes exist, parse array items containing geospatial coordinates
                if (data && data.length > 0) {
                    data.forEach(strike => {
                        // Plot strike with customized glowing styling
                        const marker = L.circleMarker([strike.lat, strike.lon], {
                            radius: 8,
                            fillColor: '#ffea00',
                            color: '#ff9100',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                        
                        const time = new Date(strike.datetime).toLocaleTimeString();
                        marker.bindPopup(`<b>Lightning Strike</b><br>Detected: ${time}<br>Confidence: ${strike.quality || 'N/A'}`);
                        lightningLayer.addLayer(marker);
                    });
                    
                    status.innerText = `Success! Plotted ${data.length} recent lightning strikes.`;
                    status.style.color = "#3fb950";
                } else {
                    status.innerText = "No lightning strikes detected in this range during the past hour.";
                    status.style.color = "#e3b341";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Error pulling data. Verify subscription tier permissions or API Key.";
                status.style.color = "#f85149";
            }
        }
    </script>
</body>
</html>
