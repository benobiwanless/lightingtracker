<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Lightning Map - Fullscreen Radar</title>
    <style>
        /* 📱 Force the document to take up exactly 100% of the screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0a0c10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* 🗺️ Makes the lightning grid iframe fill the total browser window */
        .map-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 📡 Small clean status overlay badge resting on top of the map */
        .status-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(15, 18, 24, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            pointer-events: none; /* Keeps the map draggable underneath the badge */
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #00f2fe;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Small Floating Dashboard Accent Info -->
    <div class="status-badge">
        <div class="pulse-dot"></div>
        <span>LIVE GLOBAL FEED</span>
    </div>

    <!-- 🌐 The Official Real-Time Map System Framework -->
    <iframe 
        class="map-frame" 
        src="https://blitzortung.org" 
        allow="geolocation"
        loading="lazy">
    </iframe>

</body>
</html>
